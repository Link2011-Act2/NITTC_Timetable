<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SKTJF 時間割エディター</title><link rel="stylesheet" href="/web/style.css"></head>
<body><header><div><strong>SKTJF</strong><span>時間割エディター</span></div><div class="actions"><label class="button">PDFを追加<input id="pdf-input" type="file" accept="application/pdf" hidden></label><label class="button">作業を開く<input id="project-input" type="file" accept=".json,application/json" hidden></label><button id="save">作業を保存</button></div></header>
<main><section class="pane pdf-pane"><div class="pane-head"><div><h1>元のPDF</h1><p id="pdf-name">PDFを追加してください</p></div><div class="toolbar"><label>表示するPDF <select id="source" aria-label="表示するPDF"></select></label><button id="prev">前へ</button><span id="page-label">—</span><button id="next">次へ</button><button id="zoom-out" aria-label="PDFを縮小">−</button><span id="zoom-label">100%</span><button id="zoom-in" aria-label="PDFを拡大">＋</button></div></div><div class="pdf-scroll"><canvas id="pdf"></canvas></div></section>
<section class="pane data-pane"><div class="pane-head"><div><h1>時間割</h1><p id="summary">セルを選んで編集します</p></div><div class="toolbar"><label>年度 <input id="year" type="number" min="2000" max="2100" value="2026"></label><label>学期 <select id="term"><option value="S">前期</option><option value="F">後期</option></select></label><label>クラス <input id="class-id" list="class-options" value="1-1" maxlength="40" aria-label="クラス"></label><datalist id="class-options"></datalist><label>時限数 <input id="period-count" type="number" min="1" max="12" value="4"></label><button id="undo">元に戻す</button><button id="redo">やり直す</button><button id="table-zoom-out" aria-label="表を縮小">−</button><button id="table-zoom-in" aria-label="表を拡大">＋</button></div><div class="toolbar"><button id="lesson-tab" aria-pressed="true">授業表</button><button id="calendar-tab" aria-pressed="false">隔週表</button><label id="scope-label" hidden>対象 <input id="scope" list="scopes" value="1・2・3年生"><datalist id="scopes"></datalist></label><label id="week-label" hidden>週を追加 <input id="week" type="date"></label><button id="add-week" hidden>週を追加</button><button id="next-issue">次の確認箇所</button><button id="next-missing">次の未入力</button></div><details id="calendar-range" hidden><summary>期間をまとめて追加</summary><div class="toolbar"><label>開始 <input id="range-start" type="date"></label><label>終了 <input id="range-end" type="date"></label><label><input id="range-source" type="checkbox">表示中のPDF・ページを出典にする</label><button id="add-range">期間を追加</button></div></details>
<details id="bulk-review"><summary>範囲をまとめて確認</summary><p>PDFと照合した範囲を指定してください。</p><div id="bulk-lesson" class="toolbar"><label>曜日 <select id="bulk-first-day" aria-label="開始曜日"><option value="1">月</option><option value="2">火</option><option value="3">水</option><option value="4">木</option><option value="5">金</option></select>〜<select id="bulk-last-day" aria-label="終了曜日"><option value="1">月</option><option value="2">火</option><option value="3">水</option><option value="4">木</option><option value="5" selected>金</option></select></label><label>時限 <input id="bulk-first-period" aria-label="開始時限" type="number" min="1" max="12" value="1">〜<input id="bulk-last-period" aria-label="終了時限" type="number" min="1" max="12" value="4"></label></div><div id="bulk-calendar" class="toolbar" hidden><label>開始 <input id="bulk-start" type="date"></label><label>終了 <input id="bulk-end" type="date"></label></div><div class="toolbar"><button id="bulk-confirm">確認済みにする</button><button id="bulk-unconfirm">未確認に戻す</button></div><p id="bulk-status" role="status" aria-live="polite"></p></details></div>
<div class="data-scroll"><div class="table-scroll" tabindex="0" aria-label="時間割表"><div id="table-wrap"></div></div><div class="details-scroll" tabindex="0" aria-label="セルの編集と書き出し"><div id="editor"><p class="empty">表のセルを選択してください</p></div><div id="warnings"></div><div id="legacy" hidden></div><details id="export-settings"><summary>SKTJFを書き出す</summary><div class="fields"><label class="field">隔週表の対象<input id="export-scope" list="scopes"></label><label class="field">学期開始<input id="export-start" type="date"></label><label class="field">学期終了<input id="export-end" type="date"></label><label class="field">改訂番号<input id="export-revision" type="number" min="0" step="1" value="0"></label></div><div id="period-times" class="fields"></div><label class="row"><input id="coverage-confirmed" type="checkbox">この学期の資料をすべて確認しました</label><button id="export">SKTJFを書き出す</button><p id="export-status" role="status" aria-live="polite"></p></details><p id="status" role="status" aria-live="polite"></p></div></div></section></main><script type="module" src="/web/app.js"></script></body></html>
