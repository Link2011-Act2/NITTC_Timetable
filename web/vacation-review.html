<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SKTJF 長期休業の監修</title>
  <link rel="stylesheet" href="/web/style.css">
</head>
<body>
  <header>
    <div><strong>SKTJF</strong><span>長期休業の監修</span></div>
    <div class="actions">
      <a class="button" href="/">時間割エディター</a>
      <label class="button">監修ファイルを開く<input id="draft" type="file" accept=".json,application/json" hidden></label>
      <button id="save" type="button" disabled>監修ファイルを保存</button>
    </div>
  </header>
  <main>
    <section class="pane pdf-pane">
      <div class="pane-head">
        <h1>出典PDF</h1>
        <p id="pdf-name">出典PDFを開いて照合できます</p>
        <div class="toolbar">
          <label class="button">PDFを開く<input id="pdf-input" type="file" accept="application/pdf" multiple hidden></label>
          <label>表示するPDF <select id="pdf-source" disabled></select></label>
          <button id="prev" type="button" disabled>前へ</button><span id="page">—</span><button id="next" type="button" disabled>次へ</button>
          <button id="zoom-out" type="button" aria-label="PDFを縮小" disabled>−</button>
          <button id="zoom-in" type="button" aria-label="PDFを拡大" disabled>＋</button>
        </div>
      </div>
      <div class="pdf-scroll"><canvas id="pdf" hidden></canvas></div>
    </section>
    <section class="pane data-pane">
      <div class="pane-head">
        <h1>休業期間</h1>
        <p id="summary">監修ファイルを開いてください</p>
        <nav id="period-list" class="toolbar" aria-label="休業一覧"></nav>
      </div>
      <div class="details-scroll">
        <p id="status" role="status" aria-live="polite"></p>
        <form id="entry" hidden>
          <div class="fields">
            <label class="field">休業名<input name="name" maxlength="128" required></label>
            <label class="field">開始日<input name="start" type="date" required></label>
            <label class="field">終了日<input name="end" type="date"></label>
            <label class="field">確認済みの最終日<input name="confirmedThrough" type="date" required></label>
            <label class="field">終了月の目安<input name="estimatedEndMonth" type="number" min="1" max="12"></label>
          </div>
          <p id="evidence" class="extracted-text"></p>
          <h2>出典</h2><div id="sources"></div>
          <div class="toolbar">
            <button id="add-source" type="button" disabled>表示中のPDFを出典に追加</button>
            <button id="approve" type="submit">承認する</button>
            <button id="unapprove" type="button" hidden>未承認に戻す</button>
          </div>
        </form>
      </div>
    </section>
  </main>
  <script type="module" src="/web/vacation-review.js"></script>
</body>
</html>
